<group name="razr, ransomware, malware">

<!-- Encryption of system files -->
  <rule id="111900" level="2">
    <if_sid>61613</if_sid>
    <field name="win.eventdata.image" type="pcre2">(?i)[C-Z]:.*\\\\.*.exe</field>
    <field name="win.eventdata.targetFilename" type="pcre2">(?i)[C-Z]:.*\\\\.*.raz$</field>
    <description>Razr ransomware executable $(win.eventdata.image) has encrypted the $(win.eventdata.targetFilename) file.</description>
    <mitre>
      <id>T1486</id>
      <id>T1036.005</id>
    </mitre>
  </rule>
 
 <!-- Encryption of system files -->
  <rule id="111901" level="15" timeframe="100" frequency="5" ignore="30">
    <if_matched_sid>111900</if_matched_sid>
    <description>Multiple files have been encrypted by Razr ransomware $(win.eventdata.image) using the ".raz" extension.</description>
    <mitre>
      <id>T1486</id>
      <id>T1036.005</id>
    </mitre>
  </rule>

<!-- Ransome note file creation -->
  <rule id="111902" level="2">
    <if_sid>61613</if_sid>
    <field name="win.eventdata.image" type="pcre2">(?i)[C-Z]:.*\\\\.*.exe</field>
    <field name="win.eventdata.targetFilename" type="pcre2">(?i)[C-Z]:.*\\\\README.txt</field>
    <description>Possible Razr ransomware detected. A ramsomeware note $(win.eventdata.targetFilename) has been created.</description>
    <mitre>
      <id>T1486</id>
    </mitre>
  </rule>
 
 <!-- Ransome note file creation -->
  <rule id="111903" level="12" timeframe="100" frequency="5" ignore="30">
    <if_matched_sid>111902</if_matched_sid>
    <description>Possible Razr ransomware detected. Multiple ramsomeware notes (README.txt) have been created by $(win.eventdata.image).</description>
    <mitre>
      <id>T1486</id>
    </mitre>
  </rule>

</group>


<group name="deerstealer, stealer-malware,">

<!-- Persistence detection -->
  <rule id="111200" level="12">
    <if_sid>61609</if_sid>
    <field name="win.eventdata.image" type="pcre2">\\\\(Windows|Users)\\\\.+\\\\(skotes|cmd|ActiveISO|sxqnmytm|DllHost|(?!(svchost.exe|powershell.exe))\w+).exe</field>
    <field name="win.eventdata.imageLoaded" type="pcre2">\\\\Windows\\\\SysWOW64.+(mstask|Bichromate|msvcp140|Qt5Core|Qt5Gui|Qt5Network|Qt5PrintSupport|Qt5Widgets|StarBurn|vcruntime140|msvcp140).+dll</field>
    <description>Possible DeerStealer malware detected. New scheduled task: $(win.eventdata.imageLoaded) was created by: $(win.eventdata.image).</description>
    <mitre>
      <id>T1053.005</id>
    </mitre>
  </rule>

<!-- Malicious file creation -->
  <rule id="111201" level="12">
    <if_sid>61613</if_sid>
    <field name="win.eventdata.image" type="pcre2">\\\\(Windows|Users)\\\\.+\\\\(skotes|cmd|(?!(svchost.exe))\w+).exe</field>
    <field name="win.eventdata.targetFilename" type="pcre2">\\\\(Windows|Users)\\\\.+\\\\(skotes|ActiveISO|sxqnmytm|DllHost|CHROME.EXE|ELEVATION_SERVICE.EXE|SKOTES.EXE)(.job|.exe|.pf|.js)</field>
    <description>Possible DeerStealer malware activity detected. Malicious file created at $(win.eventdata.targetFilename) by $(win.eventdata.image).</description>
    <mitre>
      <id>T1059</id>
      <id>T1105</id>
    </mitre>
  </rule>


<!-- Executable dropped in Malicious location -->
  <rule id="111202" level="12">
    <if_sid>92213</if_sid>
    <field name="win.eventdata.image" type="pcre2">\\\\(Windows|Users)\\\\.+\\\\(svchost|skotes|cmd|\w+|\d+).exe</field>
    <field name="win.eventdata.targetFilename" type="pcre2">\\\\Users\\\\.+\\\\AppData\\\\Local\\\\.+(skotes|ActiveISO|sxqnmytm|DllHost)|(.job|.exe|.pf|.js)</field>
    <description>Possible DeerStealer malware activity detected. Executable file dropped in folder commonly used by malware: $(win.eventdata.targetFilename).</description>
    <mitre>
      <id>T1105</id>
      <id>T1059</id>
    </mitre>
  </rule>

<!-- Process creation -->
  <rule id="111203" level="12">
    <if_sid>61603</if_sid>
    <field name="win.eventdata.commandLine" type="pcre2">\\\\Users\\.+\\\\AppData\\\\Local\\\\Temp\\\\.+skotes.exe</field>
    <description>Possible DeerStealer malware executable: $(win.eventdata.commandLine) was run.</description>
    <mitre>
      <id>T1543</id>
    </mitre>
  </rule>

<!-- Network connection to C2 server -->
  <rule id="111204" level="12">
    <if_sid>61605</if_sid>
    <field name="win.eventdata.image" type="pcre2">\\\\Users\\\\.+\\\\AppData\\\\Local\\\\Temp\\\\.+\\\\(skotes|\w+).exe</field>
    <field name="win.system.message" type="pcre2">Network connection detected</field>
      <field name="win.eventdata.destinationPort" type="pcre2">80</field>
    <description>Possible DeerStealer network connection to C2 server: $(win.eventdata.destinationIp) on port: $(win.eventdata.destinationPort).</description>
    <mitre>
      <id>T1105</id>
    </mitre>
  </rule>

<!-- Registry tampering - targeting HKLM -->
  <!--<rule id="111205" level="12">-->
  <!--  <if_sid>61614, 61615</if_sid>-->
  <!--  <field name="win.eventdata.image" type="pcre2">\\\\(Windows|Users)\\\\.+\\\\(skotes|cmd|karat|(?!(svchost.exe))\w+).exe</field>-->
  <!--  <field name="win.eventdata.eventType" type="pcre2">(CreateKey|SetValue)</field>-->
  <!--  <field name="win.eventdata.targetObject" type="pcre2">HKLM\\\\(System|SOFTWARE)\\\\(CurrentControlSet|Microsoft)\\\\(Control|Windows NT|Services)\\\\(SecurityProviders|CurrentVersion|bam)\\\\.+\\\\(skotes|ActiveISO|sxqnmytm|DllHost|msedge|chrome|cmd).exe</field>-->
  <!--  <description>Possible DeerStealer malware executable, $(win.eventdata.image) performed $(win.eventdata.eventType) on $(win.eventdata.targetObject).</description>-->
  <!--  <mitre>-->
  <!--    <id>T1543</id>-->
  <!--    <id>T1053.005</id>-->
  <!--  </mitre>-->
  <!--</rule>-->

<!-- Registry tampering - targeting HKU for persistence on next logon -->
  <rule id="111206" level="12">
    <if_sid>61614, 61615, 92300</if_sid>
    <field name="win.eventdata.image" type="pcre2">\\\\(Windows|Users)\\\\.+\\\\(skotes|cmd|karat(?!(svchost.exe))).exe</field>
    <field name="win.eventdata.eventType" type="pcre2">(CreateKey|SetValue)</field>
    <field name="win.eventdata.targetObject" type="pcre2">HKU\\\\.+\\\\Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Run\\\\.+exe</field>
    <description>Possible DeerStealer malware executable, $(win.eventdata.image) performed $(win.eventdata.eventType) on $(win.eventdata.targetObject).</description>
    <mitre>
      <id>T1547</id>
      <id>T1053.005</id>
    </mitre>
  </rule>

</group>


<group name="windows,sysmon,blx_detection_rule,">
<!-- Blx drops powershell script -->
  <rule id="101300" level="10">
    <if_sid>92200</if_sid>
    <field name="win.eventdata.image" type="pcre2">(?i)\\\\.+(exe|dll|bat|msi)</field>
    <field name="win.eventdata.targetFilename" type="pcre2">(?i)\\\\temp.ps1</field>
    <description>Possible BLX stealer activity detected: A rogue powershell script was dropped to system.</description>
    <mitre>
      <id>T1105</id>
    </mitre>
  </rule>

<!-- Blx starts a command prompt to execute previously dropped script -->
  <rule id="101310" level="10">
    <if_sid>92052</if_sid>
    <field name="win.eventdata.parentImage" type="pcre2">(?i)\\\\.+(exe|dll|bat|msi)</field>
    <field name="win.eventdata.image" type="pcre2">(?i)\\\\Windows\\\\System32\\\\cmd.exe</field>
    <field name="win.eventdata.commandLine" type="pcre2">powershell.exe -ExecutionPolicy Bypass -File</field>
    <description>Possible BLX stealer activity detected: Rogue powershell script execution.</description>
    <mitre>
      <id>T1059.003</id>
    </mitre>
  </rule>

<!-- Blx dropped an executable to temp folder -->
  <rule id="101320" level="10">
    <if_sid>92213</if_sid>
    <field name="win.eventdata.image" type="pcre2">(?i)\\\\.+(exe|dll|bat|msi)</field>
    <field name="win.eventdata.targetFilename" type="pcre2">(?i)\\\\Users\\\\[^\\\\]+\\\\AppData\\\\Local\\\\Temp\\\\decrypted_executable.exe</field>
    <description>Possible BLX stealer activity detected: Rogue executable was dropped to system.</description>
    <mitre>
      <id>T1105</id>
    </mitre>
  </rule>

<!-- Rogue executable copies itself to users' startup folder for persistence -->
  <rule id="101330" level="10">
    <if_sid>61613</if_sid>
    <field name="win.eventdata.image" type="pcre2">(?i)\\\\Users\\\\[^\\\\]+\\\\AppData\\\\Local\\\\Temp\\\\decrypted_executable.exe</field>
    <field name="win.eventdata.targetFilename" type="pcre2">(?i)\\\\Users\\\\[^\\\\]+\\\\AppData\\\\Roaming\\\\Microsoft\\\\Windows\\\\Start Menu\\\\Programs\\\\Startup\\\\decrypted_executable.exe</field>
    <description>Possible BLX stealer persistence activity detected: Rogue executable was copied to users' startup folder to establish persistence.</description>
    <mitre>
      <id>T1547.001</id>
    </mitre>
  </rule>
</group>


<group name="medusa,ransomware,">
<!--Detects system process termination -->
  <rule id="100012" level="2">
    <if_sid>61603</if_sid>
    <field name="win.eventdata.commandLine" type="pcre2">(?i)taskkill \/F \/IM .*. \/T</field>
    <field name="win.eventdata.parentImage" type="pcre2">(?i)[C-Z]:.*\\\\.*.exe</field>
    <description>System process terminated using $(win.eventdata.originalFileName). Suspicious activity detected.</description>
    <mitre>
      <id>T1490</id>
      <id>T1059.003</id>
    </mitre>
  </rule>
<!--Detects multiple system process termination -->
  <rule id="100013" level="12" frequency="10" timeframe="300">
    <if_matched_sid>100012</if_matched_sid>
    <description>Multiple system processes terminated using $(win.eventdata.originalFileName). Suspicious activity detected.</description>
    <mitre>
      <id>T1490</id>
      <id>T1059.003</id>
    </mitre>
  </rule>
<!--Detects system service termination -->
  <rule id="100014" level="2">
    <if_sid>92031</if_sid>
    <field name="win.eventdata.parentImage" type="pcre2">(?i)[C-Z]:.*\\\\.*.exe</field>
    <field name="win.eventdata.commandLine" type="pcre2">(?i)[C-Z]:.*\\\\.*.net.*. stop \\.*.\\" \/y</field>
    <description>System service terminated using $(win.eventdata.originalFileName). Suspicious activity detected.</description>
    <mitre>
      <id>T1490</id>
      <id>T1059.003</id>
    </mitre>
  </rule>
<!--Detects multiple system service termination -->
  <rule id="100015" level="12" frequency="60" timeframe="500" ignore="500">
    <if_matched_sid>100014</if_matched_sid>
    <description>Multiple system services terminated using $(win.eventdata.originalFileName). Suspicious activity detected.</description>
    <mitre>
      <id>T1490</id>
      <id>T1059.003</id>
    </mitre>
  </rule>
<!-- Ransom note file creation -->
  <rule id="100016" level="15" timeframe="200" frequency="2">
    <if_sid>61613</if_sid>
    <field name="win.eventdata.image" type="pcre2">(?i)[C-Z]:.*\\\\.*.exe</field>
    <field name="win.eventdata.targetFilename" type="pcre2">(?i)[C-Z]:.*.\\\\!!!READ_ME_MEDUSA!!!.txt</field>
    <description>Medusa ransom note $(win.eventdata.targetFilename) has been created in multiple directories. Possible Medusa ransomware detected.</description>
    <mitre>
      <id>T1486</id>
    </mitre>
  </rule>
  <rule id="100017" level="15" timeframe="300" frequency="2" ignore="100">
    <if_matched_sid>100015</if_matched_sid>
    <if_sid>100013</if_sid>
    <description>Possible Medusa ransomware detected.</description>
    <mitre>
      <id>T1486</id>
    </mitre>
  </rule>
</group>


<group name="impacket,">
  <rule id="110010" level="12">
    <if_sid>92069,92052</if_sid>
    <field name="win.eventdata.parentimage" type="pcre2">(?i)\\wmiprvse\.exe$|\\mmc\.exe$|\\explorer\.exe$|\\services\.exe$</field>
    <field name="win.eventdata.commandline" type="pcre2">(?i)cmd\.exe \/Q \/c</field>
    <description>Suspicious remote command execution via $(win.eventdata.parentimage).</description>
    <mitre>
      <id>T1047</id>
      <id>T1021.003</id>
    </mitre>
  </rule>
  <rule id="110011" level="8">
    <if_sid>61613</if_sid>
    <field name="win.eventdata.image" type="pcre2">(?i)\\svchost\.exe$</field>
    <field name="win.eventdata.targetfilename" type="pcre2">(?i)\\Windows\\\\*System32\\\\*\w{8}\.tmp$|\\Windows\\\\*temp\\\\*\w{8}\.tmp$</field>
    <description>Possible attempt to dump credentials. svchost.exe created a temporary file $(win.eventdata.targetfilename).</description>
    <mitre>
      <id>T1003</id>
    </mitre>
  </rule>
</group>


<group name="Sosaso backdoor, malware,">
<!-- The LNK file uses mshta.exe to execute the PDF/HTA polyglot file -->
 <rule id="101111" level="12">
    <if_sid>61603</if_sid>
    <field name="win.eventdata.image">\\mshta.exe$</field>
    <regex type="pcre2" field="win.eventdata.commandLine">(?i)C:\\.*\\electronica-2024\.pdf</regex>
    <description>Suspicious execution: mshta.exe running electronica-2024.pdf detected.Potential Sosano malware activity detected.</description>
    <mitre>
      <id>T1218.005</id> <!-- MITRE ATT&CK: Mshta Abuse -->
    </mitre>
  </rule>
<!-- Malware loads the second PDF file -->
  <rule id="101112" level="12">
    <if_sid>61613</if_sid>
    <field name="win.eventdata.image" type="pcre2">(?i)[C-Z]:.*\.exe</field>
    <field name="win.eventdata.targetFilename" type="pcre2">(?i)[C-Z]:\\\\Windows\\\\Tasks\\\\14s.pdf$</field>
    <description>The process $(win.eventdata.image) loads file $(win.eventdata.targetFilename) associated with Sosano backdoor malware.</description>
  </rule>
<!-- Malware looks for a file named sosano.jpg -->
  <rule id="101113" level="12">
    <if_sid>61613</if_sid>
    <field name="win.eventdata.image" type="pcre2">(?i)[C-Z]:.*\.exe</field>
    <field name="win.eventdata.targetFilename" type="pcre2">(?i)[C-Z]:\\\\Windows\\\\Tasks\\\\sosano.jpg$</field>
    <description>The process $(win.eventdata.image) looks for file $(win.eventdata.targetFilename). Activity associated with Sosano backdoor malware detected.</description>
  </rule>
  
  <!-- Malware looks for a file named hyper.jpg -->
  <rule id="101114" level="12">
    <if_sid>61613</if_sid>
    <field name="win.eventdata.image" type="pcre2">(?i)[C-Z]:.*\.exe</field>
    <field name="win.eventdata.targetFilename" type="pcre2">(?i)[C-Z]:\\\\Windows\\\\Tasks\\\\hyper.jpg$</field>
    <description>The process $(win.eventdata.image) looks for file $(win.eventdata.targetFilename). Activity associated with Sosano backdoor malware detected.</description>
  </rule>
<!-- Malware loads Hyper-info.exe -->
  <rule id="101115" level="12">
    <if_sid>61613</if_sid>
    <field name="win.eventdata.targetFilename" type="pcre2">(?i)[C-Z]:\\\\Windows\\\\Tasks\\\\Hyper-info.exe$</field>
    <description>The process $(win.eventdata.image) loads $(win.eventdata.targetFilename). Activity associated with Sosano backdoor malware detected.</description>
  </rule>
<!-- Malware extract the OrderList.xlsx LNK file -->
  <rule id="101116" level="12">
    <if_sid>61613</if_sid>
    <field name="win.eventdata.image" type="pcre2">(?i)[C-Z]:.*\.exe</field>
    <field name="win.eventdata.targetFilename" type="pcre2">(?i)[C-Z]:\\\\Windows\\\\Tasks\\\\OrderList.xlsx$</field>
    <description>The process $(win.eventdata.image) extracts file $(win.eventdata.targetFilename). Activity associated with Sosano backdoor malware detected.</description>
  </rule>
<!-- Malware writes URL file to the registry runkey for persistence -->
  <rule id="101117" level="12">
    <if_sid>92300</if_sid>
    <field name="win.eventdata.eventType" type="pcre2">SetValue</field>
    <field name="win.eventdata.targetObject" type="pcre2">HKU\\\\S-1-5-21-\d+-\d+-\d+-\d+\\\\Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Run\\\\MyUrlFile$</field>
    <field name="win.eventdata.details" type="pcre2">(?i)[C-Z]:\\\\Windows\\\\Tasks\\\\youtube.url$</field>
    <description>Sosano backdoor malware added URL file $(win.eventdata.targetObject) to registry runkey to be executed on next logon. Sosano backdoor malware activity detected.</description>
  </rule>
</group>



<group name="syscheck,">
  <rule id="110300" level="7">
    <if_sid>550</if_sid>
    <field name="file">/tmp/yara/malware/</field>
    <description>File modified in /tmp/yara/malware/ directory.</description>
  </rule>
  <rule id="110301" level="7">
    <if_sid>554</if_sid>
    <field name="file">/tmp/yara/malware/</field>
    <description>File added to /tmp/yara/malware/ directory.</description>
  </rule>
</group>

<!--  Rule for the decoder (yara_decoder) -->
<group name="yara,">
  <rule id="100213" level="0">
    <decoded_as>yara_decoder</decoded_as>
    <description>Yara grouping rule</description>
  </rule>
<!--  YARA scan detects a positive match -->
  <rule id="100214" level="12">
    <if_sid>100213</if_sid>
    <match type="pcre2">wazuh-yara: INFO - Scan result: </match>
    <description>File "$(yara_scanned_file)" is a ransomware. Yara rule: $(yara_rule)</description>
  </rule>
<!--  Wazuh successfully deletes malware with a positive match -->
  <rule id="100215" level="12">
    <if_sid>100213</if_sid>
    <match type="pcre2">wazuh-yara: INFO - Successfully deleted: </match>
    <description>Successfully removed "$(yara_scanned_file)" by active response due to YARA rule $(yara_rule) positive match</description>
  </rule>
<!--  Wazuh encounters an error when deleting malware with a positive match -->
  <rule id="100216" level="12">
    <if_sid>100213</if_sid>
    <match type="pcre2">wazuh-yara: INFO - Error removing threat: </match>
    <description>Error removing "$(yara_scanned_file)". YARA rule: $(yara_rule)</description>
  </rule>
</group>




